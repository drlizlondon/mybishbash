name: Staging Checks

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Feature boundaries
        run: npm run test:boundaries

      - name: Unit tests
        run: npm run test:unit

      - name: Launch-session reducer coverage
        run: npm run test:coverage:launch-session

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Bundle budget
        run: npm run test:bundle-budget

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Before-push checks
        run: npm run test:before-push
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Playwright smoke tests
        run: npx playwright test tests/e2e/release-smoke.spec.ts tests/e2e/commitment-cards.spec.ts tests/e2e/card-overlay-mobile.spec.ts --project=release-smoke
        env:
          PLAYWRIGHT_TEST_OUTPUT_DIR: test-results/chromium-smoke
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/chromium-smoke
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Chromium storage migration
        run: npx playwright test tests/e2e/storage-migration.spec.ts --project=release-smoke
        env:
          PLAYWRIGHT_TEST_OUTPUT_DIR: test-results/chromium-storage-migration
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/chromium-storage-migration
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || vars.VITE_VAPID_PUBLIC_KEY }}

      - name: WebKit persistence smoke
        run: npx playwright test --project=webkit-smoke
        env:
          PLAYWRIGHT_TEST_OUTPUT_DIR: test-results/webkit-persistence
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit-persistence
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
