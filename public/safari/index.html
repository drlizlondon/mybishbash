<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F2EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Safari" />
    <link rel="manifest" href="/mybishbash/launchers/safari/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mybishbash/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/mybishbash/install/install.css" />
    <title>Safari · MyBishBash</title>
  </head>
  <body>
    <main class="install-shell">
      <header class="install-brand">
        <svg viewBox="0 0 32 32" class="install-heart" aria-hidden="true"><path d="M16 27s-9-6-12-11c-3-5 0-11 6-11 3 0 5 1 6 4 1-3 3-4 6-4 6 0 9 6 6 11-3 5-12 11-12 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>MyBishBash</h1>
        <p>private little messages from your earlier self</p>
      </header>
      <section class="install-card">
        <a data-launch-link class="install-icon-link" href="/mybishbash/intercept/safari" aria-label="Open Safari launcher">
          <img data-install-icon class="install-icon" src="/mybishbash/icons/apple-touch-icon.png" alt="Safari icon" />
        </a>
        <div class="install-copy">
          <h2 data-version-name>Safari</h2>
          <p>Tap Share, then Add to Home Screen.</p>
          <p class="install-note">This launcher uses launcherContext "<span data-launcher-context>safari</span>" and the same shared MyBishBash state.</p>
        </div>
        <div class="install-steps">
          <strong>Install</strong>
          <p>Tap Share, then Add to Home Screen.</p>
        </div>
        <a data-settings-link class="install-settings-link" href="/mybishbash/settings">Back to MyBishBash settings</a>
      </section>
    </main>
    <script src="/mybishbash/install/install.js"></script>
  </body>
</html>
