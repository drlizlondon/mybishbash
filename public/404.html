<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>myBishBash</title>
    <script>
      (function () {
        var base = "/mybishbash";
        var current = window.location.pathname.replace(base, "") || "/";
        var next = base + "/?route=" + encodeURIComponent(current + window.location.search + window.location.hash);
        window.location.replace(next);
      })();
    </script>
  </head>
  <body></body>
</html>
