<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F2EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Instagram" />
    <link rel="manifest" href="/bishbash/instagram/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/bishbash/icons/instagram-cover.jpg" />
    <link rel="stylesheet" href="/bishbash/install/install.css" />
    <title>Instagram · BishBash</title>
  </head>
  <body>
    <main class="install-shell">
      <header class="install-brand">
        <svg viewBox="0 0 32 32" class="install-heart" aria-hidden="true"><path d="M16 27s-9-6-12-11c-3-5 0-11 6-11 3 0 5 1 6 4 1-3 3-4 6-4 6 0 9 6 6 11-3 5-12 11-12 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>BishBash</h1>
        <p>private little messages from your earlier self</p>
      </header>
      <section class="install-card">
        <img data-install-icon class="install-icon" src="/bishbash/icons/instagram-cover.jpg" alt="Instagram icon" />
        <div class="install-copy">
          <h2 data-version-name>Instagram</h2>
          <p>Tap Share, then Add to Home Screen.</p>
          <p class="install-note">This version opens BishBash, while keeping a discreet Instagram escape button inside.</p>
        </div>
        <div class="install-steps">
          <strong>Install</strong>
          <p>Tap Share, then Add to Home Screen.</p>
        </div>
      </section>
    </main>
    <button type="button" class="install-real-app" data-real-app-button aria-label="Open Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 12l4.5-5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12l-3.2 4.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Instagram</span>
    </button>
    <script src="/bishbash/install/install.js"></script>
  </body>
  </html>
