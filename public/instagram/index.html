<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F2EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Instagram" />
    <link rel="manifest" href="/mybishbash/launchers/instagram/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mybishbash/icons/instagram-cover.jpg" />
    <link rel="stylesheet" href="/mybishbash/install/install.css" />
    <title>Instagram · myBishBash</title>
  </head>
  <body>
    <main class="install-shell">
      <header class="install-brand">
        <img class="install-brand-logo" src="/mybishbash/icons/mybishbash-logo-mark.png" alt="" />
        <h1>myBishBash</h1>
        <p>phone triggers for the habits and commitments you want to keep</p>
      </header>
      <section class="install-card">
        <a data-launch-link class="install-icon-link" href="/mybishbash/intercept/instagram" aria-label="Open Instagram launcher">
          <img data-install-icon class="install-icon" src="/mybishbash/icons/instagram-cover.jpg" alt="Instagram icon" />
        </a>
        <div class="install-copy">
          <h2>Add <span data-version-name>Instagram</span> with myBishBash</h2>
          <p>Add this version to your Home Screen. Use it instead of the original <span data-version-name-inline>Instagram</span> icon when you want myBishBash to appear first.</p>
        </div>
        <div class="install-steps">
          <strong>Install panel</strong>
          <p>Tap Share, then Add to Home Screen.</p>
        </div>
        <div class="install-actions">
          <button type="button" class="install-back-button" data-install-back>Back</button>
          <button type="button" class="install-complete-button" data-install-complete>I’ve added it</button>
        </div>
      </section>
    </main>
    <script src="/mybishbash/install/install.js"></script>
  </body>
</html>
